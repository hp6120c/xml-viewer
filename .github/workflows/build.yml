name: Build and Release

on:
  push:
    branches: [ master, main ]
    paths:
      - 'version.txt'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Read version
        id: version
        shell: pwsh
        run: |
          $version = Get-Content version.txt -Raw
          $version = $version.Trim()
          echo "VERSION=$version" >> $env:GITHUB_OUTPUT
          Write-Host "版本号: $version"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install PyQt5 pyinstaller

      - name: Build EXE
        shell: pwsh
        run: python -m PyInstaller --name XMLDatabaseViewer --windowed --onefile --clean --noconfirm --hidden-import PyQt5.QtWidgets --hidden-import PyQt5.QtCore --hidden-import PyQt5.QtGui --hidden-import PyQt5.sip main.py

      - name: Rename and package
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.VERSION }}"
          $src = "dist/XMLDatabaseViewer.exe"
          if (-not (Test-Path $src)) {
            Write-Error "EXE not found: $src"
            exit 1
          }
          $dst = "dist/XMLDatabaseViewer-V${version}.exe"
          Copy-Item $src $dst
          Write-Host "Created: $dst ($(((Get-Item $dst).Length / 1MB).ToString('F2')) MB)"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: XMLDatabaseViewer-V${{ steps.version.outputs.VERSION }}
          path: dist/*.exe

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: V${{ steps.version.outputs.VERSION }}
          name: V${{ steps.version.outputs.VERSION }}
          body: "XMLDatabaseViewer V${{ steps.version.outputs.VERSION }}"
          files: dist/*.exe
          make_latest: true
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
