[package]
name = "xml-database-viewer"
version = "2.0.1"
description = "SCL Schema XML database design viewer"
authors = ["hp6120c"]
edition = "2024"

[lib]
name = "xml_database_viewer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
roxmltree = "0.21.2"
encoding_rs = "0.8"
walkdir = "2"
tempfile = "3"
thiserror = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true



